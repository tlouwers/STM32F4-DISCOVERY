EE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="79.0547" style="stroke:#000000;stroke-width:1.5;" width="392.4116" x="237.9526" y="168.5703"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="27.4346" x="252.9526" y="183.0654">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="84.9438" x="325.3872" y="181.9893">[writing chunks]</text><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="9" id="msg2"><polygon fill="#181818" points="539.1162,205.2734,549.1162,209.2734,539.1162,213.2734,543.1162,209.2734" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="302.4282" x2="545.1162" y1="209.2734" y2="209.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.3481" x="309.4282" y="204.417">Write Memory (0x31)</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="10" id="msg3"><polygon fill="#181818" points="313.4282,235.625,303.4282,239.625,313.4282,243.625,309.4282,239.625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="307.4282" x2="550.1162" y1="239.625" y2="239.625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.73" x="319.4282" y="234.7686">ACK</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="815.5933" x="0" y="275.8008"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="815.5933" y1="275.8008" y2="275.8008"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="815.5933" y1="278.8008" y2="278.8008"/><rect fill="#EEEEEE" height="24.3516" style="stroke:#000000;stroke-width:2;" width="160.6626" x="327.4653" y="264.625"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" len